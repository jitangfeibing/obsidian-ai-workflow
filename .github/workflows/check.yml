name: Migration and plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install development dependency
        shell: powershell
        run: python -m pip install -r tests/requirements.txt
      - name: Check deterministic build and payload
        shell: powershell
        run: |
          python scripts/build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify-repo.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Plugin regressions
        shell: powershell
        run: |
          foreach ($file in @('test.js','home-test.js','project-test.js','study-test.js')) {
            node (Join-Path 'plugins/personal-project-pages' $file)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          node --test tests/system-logic.test.js tests/system-ui.test.js tests/system-workflow.test.js tests/capture-panel.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\Test-ScriptSyntax.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\tests\Test-SystemInstall.ps1
          .\tests\Test-ClientOptions.ps1
          .\backup\tests\Backup.Tests.ps1 -WorkPath (Join-Path $env:TEMP ('ob-ci-backup-' + [guid]::NewGuid().ToString('N')))
          .\backup\tests\TaskDefinition.Tests.ps1
